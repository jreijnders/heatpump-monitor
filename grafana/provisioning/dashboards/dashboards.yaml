apiVersion: 1
providers:
  - name: heatpump
    type: file
    # Repo files are the source of truth: UI edits are not saved (export JSON into
    # grafana/dashboards/ instead). Set true temporarily to iterate in the UI.
    allowUiUpdates: false
    disableDeletion: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
