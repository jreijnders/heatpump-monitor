apiVersion: 1
datasources:
  - name: TimescaleDB
    uid: timescale
    type: grafana-postgresql-datasource
    access: proxy
    url: timescaledb:5432
    user: grafana_ro
    isDefault: true
    editable: false
    jsonData:
      database: heatpump
      sslmode: disable
      timescaledb: true
      postgresVersion: 1700
    secureJsonData:
      password: $GRAFANA_RO_PASSWORD
